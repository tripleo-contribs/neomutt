name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "46 1 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    container: ghcr.io/neomutt/ubuntu
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      CONFIGURE_OPTIONS: --gdbm --gnutls --gpgme --homespool --lmdb --lua --notmuch --sasl --with-domain=example.com --with-lock=flock

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure NeoMutt
        run: ./configure --disable-doc $CONFIGURE_OPTIONS

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp, python
          config-file: ./.github/codeql.yml
          queries: +security-and-quality

      - name: Build NeoMutt
        run: make -j $(nproc) -s

      - name: Perform C CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:cpp"

      - name: Perform Python CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
